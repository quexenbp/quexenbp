<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#211a10"/><stop offset=".5" stop-color="#0e0b08"/><stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#e8b949"/><stop offset="1" stop-color="#9c6b1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".4"/></pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
    <clipPath id="c1"><rect x="0" y="140" width="1200" height="20"/></clipPath>
    <clipPath id="c2"><rect x="0" y="172" width="1200" height="14"/></clipPath>
    <text id="nm" x="600" y="190" text-anchor="middle" font-family="'Cascadia Code',Consolas,'SF Mono',Menlo,monospace"
          font-size="68" font-weight="700" letter-spacing="10">QUEXENBP</text>
  </defs>
  <style>
    .ga { fill: #ffffff; mix-blend-mode: screen; opacity: 0; animation: ga 5s steps(1) infinite; }
    .gb { fill: #b8860b; mix-blend-mode: screen; opacity: 0; animation: gb 5s steps(1) infinite; }
    @keyframes ga { 0%,100% { opacity: 0; transform: none; }
      70% { opacity: .85; transform: translate(-5px,1px); } 71.5% { opacity: .85; transform: translate(4px,-1px); }
      73% { opacity: 0; transform: none; } 88% { opacity: .85; transform: translate(6px,0); } 89% { opacity: 0; transform: none; } }
    @keyframes gb { 0%,100% { opacity: 0; transform: none; }
      70% { opacity: .85; transform: translate(5px,-1px); } 71.5% { opacity: .85; transform: translate(-3px,1px); }
      73% { opacity: 0; transform: none; } 88% { opacity: .85; transform: translate(-6px,0); } 89% { opacity: 0; transform: none; } }
    .s1 { opacity: 0; animation: s1 5s steps(1) infinite; }
    .s2 { opacity: 0; animation: s2 5s steps(1) infinite; }
    @keyframes s1 { 0%,100% { opacity: 0; transform: none; } 70.5% { opacity: 1; transform: translateX(14px); } 72% { opacity: 1; transform: translateX(-9px); } 73% { opacity: 0; transform: none; } }
    @keyframes s2 { 0%,100% { opacity: 0; transform: none; } 71% { opacity: 1; transform: translateX(-16px); } 72.5% { opacity: 0; transform: none; } 88.5% { opacity: 1; transform: translateX(10px); } 89% { opacity: 0; transform: none; } }
</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <text x="600" y="110" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="6" fill="#e8b949" opacity=".55">01110001 01110101 01100101 01111000</text>
    <g filter="url(#glow)">
      <use href="#nm" class="ga"/>
      <use href="#nm" class="gb"/>
      <use href="#nm" fill="url(#gold)"/>
      <use href="#nm" fill="url(#gold)" class="s1" clip-path="url(#c1)"/>
      <use href="#nm" fill="url(#gold)" class="s2" clip-path="url(#c2)"/>
    </g>
    <text x="600" y="236" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="7" fill="#e6dcc6" opacity=".75">WEB · 3D · ARDUINO · CODE</text>
    <rect width="1200" height="340" fill="url(#scan)"/>
    <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#e8b949" stroke-opacity=".25"/>
  </g>
</svg>
